{% extends "base.html" %}{% block title %}Masuk{% endblock %}
{% block content %}<div class="card narrow"><h1>Masuk</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="nim">NIM</label><input id="nim" name="nim" inputmode="numeric" autocomplete="username" required>
<label for="pw">Kata sandi</label><input id="pw" type="password" name="password" autocomplete="current-password" required>
<p><button class="btn" type="submit">Masuk</button></p></form>
<p class="muted">Belum punya akun? <a href="{{ url_for('register') }}">Daftar</a></p></div>{% endblock %}
